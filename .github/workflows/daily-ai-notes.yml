name: Daily AI Notes (Randomized)

on:
  schedule:
    # Twice an hour. The run only publishes when a slot from today's plan is
    # due and not already committed. Most runs exit before installing anything.
    # Slots stop at 22:00 UTC; 22:07, 22:37, 22:50, and 23:07 are makeup chances
    # so a skipped run still finishes the UTC day before midnight.
    - cron: '7,37 * * * *'
    - cron: '50 22 * * *'
  workflow_dispatch: # Posts one note now if today's plan is not full yet.

permissions:
  contents: write
  id-token: write # Required for GCP Workload Identity Federation

concurrency:
  group: daily-ai-notes
  cancel-in-progress: false

jobs:
  generate-note:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Notes per UTC day. schedule.py clamps these to 1..10 inclusive.
      # Optional: set the SCHEDULE_SEED secret to pick a different sequence.
      MIN_POSTS_PER_DAY: "1"
      MAX_POSTS_PER_DAY: "10"
      MIN_GAP_MINUTES: "45"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The day's commit subjects are the record of what was already posted.
          fetch-depth: 0

      - name: Decide whether to post
        id: decision
        env:
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A run queued behind another one is created with the old SHA.
          # Count commits from the branch tip at job start so we don't retry
          # notes the previous run already pushed.
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          python3 .github/scripts/schedule.py decide >> "$GITHUB_OUTPUT"

      - name: Install dependencies with uv
        if: steps.decision.outputs.run_job == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        if: steps.decision.outputs.run_job == 'true'
        run: uv sync --frozen

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.decision.outputs.run_job == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_audience: ${{ secrets.AI_SERVICE_URL }}
          id_token_include_email: true

      - name: Append note to README and commit
        if: steps.decision.outputs.run_job == 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_ENDPOINT: ${{ secrets.AI_API_ENDPOINT }}
          CLOUDSDK_AUTH_ID_TOKEN: ${{ steps.auth.outputs.id_token }}
          POST_COUNT: ${{ steps.decision.outputs.post_count }}
          PLAN_DAY: ${{ steps.decision.outputs.day }}
        run: |
          set -euo pipefail
          if ! [[ "$POST_COUNT" =~ ^[0-9]+$ ]] || (( POST_COUNT < 1 || POST_COUNT > 10 )); then
            echo "refusing unexpected post_count=$POST_COUNT" >&2
            exit 1
          fi

          git config --global user.name "jmxt3"
          git config --global user.email "jmxt3@users.noreply.github.com"

          posted_this_run=0
          for ((i = 1; i <= POST_COUNT; i++)); do
            if [[ "$(date -u +%Y-%m-%d)" != "$PLAN_DAY" ]]; then
              echo "UTC day rolled over before posting; not writing notes onto the next day." >&2
              if (( posted_this_run == 0 )); then
                exit 1
              fi
              exit 0
            fi

            NOTE=$(uv run python .github/scripts/generate_daily_note.py)
            STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            if [[ "${STAMP%% *}" != "$PLAN_DAY" ]]; then
              echo "UTC day rolled over before the commit; discarding this note." >&2
              if (( posted_this_run == 0 )); then
                exit 1
              fi
              exit 0
            fi
            {
              printf '\n'
              printf '## 📅 %s\n' "$STAMP"
              printf '\n'
              printf '%s\n' "$NOTE"
              printf '\n'
              printf -- '---\n'
            } >> README.md

            git add README.md
            git commit -m "Daily AI note - ${STAMP}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            posted_this_run=$((posted_this_run + 1))
          done
